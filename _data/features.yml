heading: Everything you need to run your business
subheading: From quotations to work orders, inventory to banking, payroll to full accounting. Sentibooks covers the complete business cycle.

items:
  - title: Invoicing & Quotations
    description: Create professional invoices and quotations. Convert quotes to invoices or work orders in one click. Download PDFs and track statuses.
    icon_bg: bg-accent-gradient
    icon_path: "M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"

