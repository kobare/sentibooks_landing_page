tax_ready:
  - emoji: "📄"
    title: VAT Tracking
    description: Auto-compute output/input VAT on every invoice and quotation. Export summaries for your accountant or iTax filing.
  - emoji: "🧾"
    title: KRA PIN & Tax Registrations
    description: Store your KRA PIN and tax registration types directly in your organization settings. VAT, Income Tax, and more.
  - emoji: "📊"
    title: Audit-Ready Records
    description: Full audit logs track every change. Soft-deletes keep history intact. Your accountant will thank you.
