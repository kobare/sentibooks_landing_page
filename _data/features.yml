    description: Automate repeat billing with recurring invoices. Set schedules for weekly, monthly, or custom intervals. Save time on repeat customers.
    icon_bg: bg-green-gradient
    icon_path: "M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"

