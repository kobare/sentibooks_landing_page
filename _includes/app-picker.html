<div id="appPickerModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
  <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl relative overflow-hidden" style="animation: modalIn 0.2s ease-out;">
    <div class="relative bg-blue-gradient px-6 pt-6 pb-5 text-white">
      <button onclick="closeAppPicker()" aria-label="Close" class="absolute top-4 right-4 text-white/70 hover:text-white transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
      <img src="{{ '/assets/images/logo/icon.png' | relative_url }}" alt="Sentibooks" class="h-11 w-11 rounded-xl mb-3 bg-white/10 p-1">
      <h3 class="text-xl font-extrabold tracking-tight">Choose your app</h3>
      <p class="text-sm text-blue-100/80 mt-1">Select the Sentibooks app built for your business.</p>
    </div>

    <div id="appList" class="p-3 max-h-[55vh] overflow-y-auto"></div>

    <div class="px-6 py-3 border-t border-gray-100 bg-white">
      <label class="flex items-center gap-2.5 cursor-pointer select-none">
        <input type="checkbox" id="rememberChoice"
               class="h-4 w-4 rounded border-gray-300 focus:ring-2 focus:ring-[#00B057] accent-[#00B057]">
        <span class="text-sm text-gray-600">Remember my choice next time</span>
      </label>
    </div>

    <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 text-xs text-gray-500 text-center">
      More industry apps coming soon. Need a custom one? <a href="{{ '/contact/' | relative_url }}" class="text-[#0B2A6A] font-semibold hover:underline">Talk to us</a>.
    </div>
  </div>
</div>
